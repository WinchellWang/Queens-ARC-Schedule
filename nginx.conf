server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable browser caching while the site is being debugged locally.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not expose project metadata or local dependency folders.
    location ~ (^|/)\.(git|github|codex|agents)(/|$) {
        deny all;
        return 404;
    }

    location ~ (^|/)(node_modules|src)(/|$) {
        deny all;
        return 404;
    }
}
