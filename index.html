<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Browse the latest Queen's University ARC open recreation schedule. Filter activities and locations, view the next two weeks, and add events to your calendar." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#d9d9dc" />
    <link rel="canonical" href="https://winchellwang.github.io/Queens-ARC-Schedule/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Queen's ARC Schedule" />
    <meta property="og:title" content="Queen's ARC Open Recreation Schedule" />
    <meta property="og:description" content="Browse upcoming Queen's University ARC open recreation activities, filter the schedule, and add events to your calendar." />
    <meta property="og:url" content="https://winchellwang.github.io/Queens-ARC-Schedule/" />
    <meta property="og:image" content="https://winchellwang.github.io/Queens-ARC-Schedule/web_logo.jpg" />
    <meta property="og:image:alt" content="Queen's ARC Schedule logo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="./web_logo.jpg" />
    <link rel="apple-touch-icon" href="./web_logo.jpg" />
    <title>Queen's ARC Open Recreation Schedule</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Queen's ARC Schedule",
        "url": "https://winchellwang.github.io/Queens-ARC-Schedule/",
        "description": "A mobile-friendly schedule for Queen's University Athletics and Recreation Centre open recreation activities.",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "inLanguage": "en-CA",
        "image": "https://winchellwang.github.io/Queens-ARC-Schedule/web_logo.jpg",
        "author": {
          "@type": "Person",
          "name": "Winchell Wang",
          "url": "https://winchellwang.github.io/"
        }
      }
    </script>
    <script src="./assets/index.global.min.js"></script>
    <script src="./assets/ical.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SM0J28NYS4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SM0J28NYS4');
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => {
              console.log("Service Worker registered:", registration.scope);
            })
            .catch((error) => {
              console.error("Service Worker registration failed:", error);
            });
        });
      }
    </script>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <h1>
            <a class="brand-home" href="./" aria-label="Reload Queen's ARC Schedule">
              Queen's ARC Schedule
            </a>
          </h1>
          <p>Tap an event to add to calendar</p>
        </div>
        <nav class="header-actions" aria-label="Project links">
          <a class="action-link about" href="about.html">About</a>
        </nav>
      </div>
    </header>
    <main>
      <p class="schedule-intro">
        View the latest Queen's University ARC open recreation activities for
        this week and next week. Filter by activity or location, then select an
        event to add it to your calendar.
      </p>
      <section class="filters" aria-label="Schedule filters">
        <div class="filter-field">
          <label for="activityFilter">Activity</label
          ><select id="activityFilter">
            <option value="all">All</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="locationFilter">Location</label
          ><select id="locationFilter">
            <option value="all">All</option>
          </select>
        </div>
      </section>
      <section class="calendar-shell" aria-label="Two-week activity schedule">
        <div
          id="scheduleStatus"
          class="schedule-status"
          role="status"
          aria-live="polite"
          hidden
        >
          <span class="schedule-spinner" aria-hidden="true"></span>
          <span id="scheduleStatusText">Loading latest schedule…</span>
        </div>
        <div id="calendar"></div>
        <noscript>
          <p class="noscript-message">
            JavaScript is required to display the interactive ARC schedule.
            You can also download the <a href="gym.ics">ARC schedule calendar</a>.
          </p>
        </noscript>
      </section>
    </main>
    <div
      id="eventModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      hidden
    >
      <div class="modal-backdrop" data-close-modal></div>
      <article class="modal-card">
        <h2 id="modalTitle"></h2>
        <div class="detail">
          <span class="detail-icon">📍</span>
          <div>
            <small>Location</small>
            <p id="locText"></p>
          </div>
        </div>
        <div class="detail">
          <span class="detail-icon">🕒</span>
          <div>
            <small>Time</small>
            <p id="modalTime"></p>
          </div>
        </div>
        <div id="modalDesc" class="description" hidden></div>
        <button id="addToCalBtn" class="add-button" type="button">
          Add to Calendar
        </button>
      </article>
    </div>
    <script src="./assets/app.js" defer></script>
    <div
      id="scheduleToast"
      class="schedule-toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>
  </body>
</html>
