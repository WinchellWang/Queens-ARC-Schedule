<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Schedule</title>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .fc-event { cursor: pointer; border: none; }
        
        /* FIX: Ensure List View text is always visible and dark */
        .fc-list-event-title { color: #1f2937 !important; } /* text-gray-800 */
        .fc-list-day-cushion { background-color: #f3f4f6 !important; } /* bg-gray-100 */
        
        /* Mobile Toolbar Fixes */
        @media (max-width: 640px) {
            .fc-toolbar { flex-direction: column; gap: 10px; }
            .fc-toolbar-title { font-size: 1.25rem !important; }
            .fc .fc-button { padding: 0.4em 0.65em; font-size: 0.85em; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="max-w-7xl mx-auto bg-white min-h-screen md:min-h-0 md:rounded-xl md:shadow-lg md:my-6 overflow-hidden flex flex-col">
        
        <div class="p-4 border-b border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4 bg-white sticky top-0 z-30 shadow-sm md:shadow-none md:static">
            <div class="text-center md:text-left">
                <h1 class="text-2xl font-bold text-gray-900">Gym Schedule</h1>
                <p class="text-xs text-gray-500 mt-1">Tap an event to add to calendar</p>
            </div>
            
            <a href="webcal://ifgical.api.pgaskin.net/110.ics" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-6 rounded-lg shadow transition flex justify-center items-center text-sm">
                <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"/></svg>
                Sync All
            </a>
        </div>

        <div class="bg-gray-50 p-3 border-b border-gray-100">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                <div class="relative col-span-1">
                    <select id="activityFilter" onchange="applyFilters()" class="block w-full bg-white border border-gray-300 text-gray-700 py-2 px-3 pr-8 rounded text-sm leading-tight focus:outline-none focus:border-blue-500">
                        <option value="all">Activity (All)</option>
                    </select>
                </div>

                <div class="relative col-span-1">
                    <select id="locationFilter" onchange="applyFilters()" class="block w-full bg-white border border-gray-300 text-gray-700 py-2 px-3 pr-8 rounded text-sm leading-tight focus:outline-none focus:border-blue-500">
                        <option value="all">Location (All)</option>
                    </select>
                </div>

                <button onclick="resetFilters()" class="col-span-2 md:col-span-1 bg-gray-200 hover:bg-gray-300 text-gray-600 font-bold py-2 px-4 rounded text-sm transition">
                    Reset
                </button>
            </div>
        </div>

        <div class="flex-grow p-2 md:p-6 pb-20 md:pb-6">
            <div id='calendar'></div>
        </div>
    </div>

    <div id="eventModal" class="fixed inset-0 z-50 flex items-end md:items-center justify-center pointer-events-none hidden">
        <div class="absolute inset-0 bg-black bg-opacity-50 pointer-events-auto transition-opacity backdrop-blur-sm" onclick="closeModal()"></div>
        
        <div class="bg-white w-full md:w-96 md:rounded-2xl rounded-t-2xl p-6 pointer-events-auto shadow-2xl transform transition-transform duration-300 ease-out">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 md:hidden"></div>
            
            <h3 id="modalTitle" class="text-xl font-extrabold text-gray-900 mb-2 leading-tight"></h3>
            
            <div class="space-y-4 mb-6">
                <div class="flex items-start">
                    <div class="bg-blue-50 p-2 rounded-lg mr-3">
                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">Location</p>
                        <p id="locText" class="text-gray-800 font-medium text-sm"></p>
                    </div>
                </div>

                <div class="flex items-start">
                    <div class="bg-green-50 p-2 rounded-lg mr-3">
                        <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 font-bold uppercase tracking-wide">Time</p>
                        <p id="modalTime" class="text-gray-800 font-medium text-sm"></p>
                    </div>
                </div>
            </div>

            <div id="modalDesc" class="text-sm text-gray-600 mb-6 bg-gray-50 p-3 rounded-lg max-h-32 overflow-y-auto hidden"></div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl transition">Close</button>
                <button id="addToCalBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex justify-center items-center">
                    Add to Calendar
                </button>
            </div>
            <div class="h-4 md:hidden"></div>
        </div>
    </div>

    <script>
        let calendar;
        let allEvents = [];
        const isMobile = window.innerWidth < 768;

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                // Force List View on Mobile
                initialView: isMobile ? 'listWeek' : 'timeGridWeek',
                headerToolbar: {
                    left: 'prev,next', // Simplified for mobile
                    center: 'title',
                    right: isMobile ? 'listWeek,timeGridDay' : 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                slotMinTime: "06:00:00",
                slotMaxTime: "23:00:00",
                height: 'auto',
                nowIndicator: true,
                allDaySlot: false,
                navLinks: false, // Disable jumping to day view on click to prevent confusion
                
                // FIX FOR ISSUE 1: Explicitly Render Content for BOTH List and Grid views
                eventContent: function(arg) {
                    let title = arg.event.title;
                    let location = arg.event.extendedProps.location || '';
                    
                    // A. LIST VIEW RENDERING (The fix for invisible text)
                    if (arg.view.type === 'listWeek' || arg.view.type === 'listDay' || arg.view.type === 'listMonth') {
                        let html = `
                            <div class="flex flex-col w-full py-1">
                                <div class="font-bold text-gray-900 text-sm">${title}</div>
                                ${location ? `<div class="text-xs text-blue-600 mt-0.5">📍 ${location}</div>` : ''}
                            </div>
                        `;
                        return { html: html };
                    }
                    
                    // B. GRID VIEW RENDERING
                    let html = `
                        <div class="fc-event-main-frame flex flex-col h-full overflow-hidden p-0.5">
                            <div class="fc-event-title-container font-bold text-xs leading-tight sticky top-0">
                                ${title}
                            </div>
                            ${location ? `<div class="text-[10px] italic mt-0.5 opacity-90 truncate">📍${location}</div>` : ''}
                        </div>
                    `;
                    return { html: html };
                },

                eventClick: function(info) {
                    info.jsEvent.preventDefault();
                    showModal(info.event);
                }
            });

            calendar.render();
            fetchAndParseICS();
        });

        async function fetchAndParseICS() {
            try {
                const response = await fetch('./gym.ics');
                if (!response.ok) throw new Error("File not found");
                const icsData = await response.text();
                parseICS(icsData);
            } catch (error) {
                console.error("Error:", error);
                // alert("Still loading schedule... check back in a few minutes.");
            }
        }

        function parseICS(icsData) {
            try {
                const jcalData = ICAL.parse(icsData);
                const comp = new ICAL.Component(jcalData);
                const events = comp.getAllSubcomponents('vevent');
                allEvents = [];

                events.forEach(event => {
                    const vevent = new ICAL.Event(event);
                    let color = '#3b82f6';
                    const summaryLower = vevent.summary.toLowerCase();
                    
                    if(summaryLower.includes('basketball')) color = '#f97316'; 
                    if(summaryLower.includes('yoga') || summaryLower.includes('pilates')) color = '#10b981';
                    if(summaryLower.includes('swim') || summaryLower.includes('pool')) color = '#0ea5e9';
                    if(summaryLower.includes('zumba') || summaryLower.includes('dance')) color = '#ec4899';
                    if(summaryLower.includes('barre')) color = '#8b5cf6';

                    allEvents.push({
                        title: vevent.summary,
                        start: vevent.startDate.toString(),
                        end: vevent.endDate.toString(),
                        description: vevent.description,
                        location: vevent.location,
                        color: color,
                        extendedProps: {
                            location: vevent.location,
                            rawEvent: event
                        }
                    });
                });

                populateDropdowns();
                applyFilters();

            } catch (e) { console.error(e); }
        }

        function populateDropdowns() {
            const activitySet = new Set();
            const locationSet = new Set();

            allEvents.forEach(e => {
                if (e.title) activitySet.add(e.title);
                if (e.extendedProps.location) locationSet.add(e.extendedProps.location);
            });

            const actSelect = document.getElementById('activityFilter');
            const locSelect = document.getElementById('locationFilter');

            actSelect.innerHTML = '<option value="all">Activity (All)</option>';
            locSelect.innerHTML = '<option value="all">Location (All)</option>';

            Array.from(activitySet).sort().forEach(act => {
                let opt = document.createElement('option');
                opt.value = act; opt.innerText = act; actSelect.appendChild(opt);
            });

            Array.from(locationSet).sort().forEach(loc => {
                let opt = document.createElement('option');
                opt.value = loc; opt.innerText = loc; locSelect.appendChild(opt);
            });
        }

        function applyFilters() {
            const selectedActivity = document.getElementById('activityFilter').value;
            const selectedLocation = document.getElementById('locationFilter').value;

            const filteredEvents = allEvents.filter(e => {
                const matchActivity = (selectedActivity === 'all') || (e.title === selectedActivity);
                const matchLocation = (selectedLocation === 'all') || (e.extendedProps.location === selectedLocation);
                return matchActivity && matchLocation;
            });

            calendar.removeAllEvents();
            calendar.addEventSource(filteredEvents);
        }

        function resetFilters() {
            document.getElementById('activityFilter').value = 'all';
            document.getElementById('locationFilter').value = 'all';
            applyFilters();
        }

        function showModal(event) {
            document.getElementById('modalTitle').innerText = event.title;
            const loc = event.extendedProps.location || "No location info";
            document.getElementById('locText').innerText = loc;
            
            const start = event.start;
            const end = event.end;
            const dateStr = start.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
            const timeStr = start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' - ' + end.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            document.getElementById('modalTime').innerText = `${dateStr} • ${timeStr}`;
            
            const desc = event.extendedProps.description;
            const descEl = document.getElementById('modalDesc');
            if (desc) {
                descEl.innerText = desc;
                descEl.classList.remove('hidden');
            } else {
                descEl.classList.add('hidden');
            }
            
            const btn = document.getElementById('addToCalBtn');
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.onclick = () => downloadSingleEvent(event);

            document.getElementById('eventModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.add('hidden');
        }

        // FIX FOR ISSUE 2: Helper function to escape text for ICS format
        function escapeICS(str) {
            if (!str) return "";
            return str.replace(/\\/g, "\\\\") // Escape backslashes
                      .replace(/;/g, "\\;")   // Escape semicolons
                      .replace(/,/g, "\\,")   // Escape commas
                      .replace(/\n/g, "\\n"); // Escape newlines
        }

        function downloadSingleEvent(calEvent) {
            const start = calEvent.start.toISOString().replace(/-|:|\.\d+/g, "");
            const end = calEvent.end.toISOString().replace(/-|:|\.\d+/g, "");
            const now = new Date().toISOString().replace(/-|:|\.\d+/g, "");
            
            const title = escapeICS(calEvent.title);
            const description = escapeICS(calEvent.extendedProps.description || "");
            const location = escapeICS(calEvent.extendedProps.location || "");

            // Build ICS file content
            const icsContent = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Gym Schedule//EN",
                "BEGIN:VEVENT",
                `UID:${now}-${Math.floor(Math.random() * 100000)}@gymschedule`,
                `DTSTAMP:${now}`,
                `DTSTART:${start}`,
                `DTEND:${end}`,
                `SUMMARY:${title}`,
                `DESCRIPTION:${description}`,
                `LOCATION:${location}`, 
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\r\n");

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', `${calEvent.title.replace(/[^a-z0-9]/gi, '_')}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
