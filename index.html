<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="./web_logo.jpg" />
    <link rel="apple-touch-icon" href="./web_logo.jpg" />
    <title>Queen's ARC Schedule</title>
    <script src="./assets/analytics.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="./assets/ical.min.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --blue: #0a84ff;
        --ink: #172033;
        --muted: #667085;
        --line: #d9dde5;
        --panel: #fff;
        --page: #f3f4f6;
        --top: #d9d9dc;
        --day-heading-bg: #eef2f6;
        --day-heading-text: #344054;
        --day-heading-border: #d6dce5;
        --queens-gold: #fabd0f;
        --queens-gold-text: #212121;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        overscroll-behavior: none;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--page);
        color: var(--ink);
      }
      button,
      select,
      a {
        font: inherit;
        touch-action: manipulation;
      }
      button,
      .action-link {
        transition:
          transform 0.12s,
          filter 0.12s,
          background-color 0.12s,
          box-shadow 0.12s;
      }
      button:hover,
      .action-link:hover {
        filter: brightness(0.94);
      }
      button:active,
      .action-link:active {
        transform: scale(0.96);
        filter: brightness(0.84);
      }
      button:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(10, 132, 255, 0.38);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.28;
        cursor: not-allowed;
        transform: none;
        filter: none;
      }
      .site-header {
        width: 100%;
        background: var(--top);
        padding: max(8px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right)) 8px
          max(10px, env(safe-area-inset-left));
      }
      .header-inner {
        max-width: 1194px;
        margin: auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
      }
      .brand h1 {
        margin: 0;
        font-size: clamp(19px, 4.8vw, 34px);
        line-height: 1.05;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }
      .brand p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: clamp(10px, 2.4vw, 15px);
        white-space: nowrap;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .action-link {
        width: 88px;
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 2px solid transparent;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        padding: 7px 10px;
      }
      .github {
        gap: 4px;
        background: #24292e;
        border-color: #24292e;
        color: #fff;
      }
      .github svg {
        width: 17px;
        height: 17px;
      }
      .about {
        color: #fff;
        background: var(--blue);
        border-color: var(--blue);
      }
      main {
        width: 100%;
        max-width: 1194px;
        margin: 0 auto;
        padding: 4px;
      }
      .filters {
        display: grid;
        grid-template-columns: 1fr;
        gap: 4px;
        margin-bottom: 4px;
      }
      .filter-field {
        display: grid;
        grid-template-columns: 70px minmax(0, 1fr);
        align-items: center;
        gap: 5px;
      }
      .filter-field label {
        font-size: 14px;
        font-weight: 700;
      }
      select {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: inherit;
        padding: 5px 30px 5px 8px;
      }
      .calendar-shell {
        width: 100%;
        background: var(--panel);
        padding: 4px;
      }
      .fc {
        font-size: 13px;
      }
      .fc .fc-toolbar.fc-header-toolbar {
        margin: 0 0 4px;
        gap: 4px;
      }
      .fc .fc-toolbar-title {
        font-size: clamp(16px, 4.6vw, 25px);
        line-height: 1.1;
        text-align: center;
      }
      .fc .fc-button {
        min-width: 34px;
        min-height: 34px;
        padding: 4px 8px;
        border: 0;
        border-radius: 7px;
        background: #30445a;
        box-shadow: none;
      }
      .fc .fc-thisWeek-button,
      .fc .fc-nextWeek-button {
        background: #2563eb;
        opacity: 1;
        font-weight: 700;
        white-space: nowrap;
      }

      .fc .fc-thisWeek-button:disabled,
      .fc .fc-nextWeek-button:disabled {
        background: #98a2b3;
        color: #f8fafc;
        opacity: 0.48;
      }
      .fc .fc-icon {
        font-family: inherit !important;
      }
      .fc .fc-icon-chevron-left:before {
        content: "‹";
      }
      .fc .fc-icon-chevron-right:before {
        content: "›";
      }
      .fc-event {
        cursor: pointer;
        border: 0;
      }
      .fc-list {
        border-left: 0 !important;
        border-right: 0 !important;
      }
      .fc-list-day-cushion {
        padding: 5px 7px !important;
        background: var(--day-heading-bg) !important;
        color: var(--day-heading-text) !important;
        border-top: 1px solid var(--day-heading-border);
        border-bottom: 1px solid var(--day-heading-border);
      }
      .fc-list-day-cushion a,
      .fc-list-day-text,
      .fc-list-day-side-text {
        color: var(--day-heading-text) !important;
        font-weight: 700;
        text-decoration: none;
      }
      .fc-list-day.fc-day-today .fc-list-day-cushion {
        background: var(--queens-gold) !important;
        color: var(--queens-gold-text) !important;
        border-color: #d49d00;
      }
      .fc-list-day.fc-day-today .fc-list-day-cushion a,
      .fc-list-day.fc-day-today .fc-list-day-text,
      .fc-list-day.fc-day-today .fc-list-day-side-text {
        color: var(--queens-gold-text) !important;
      }
      .fc .fc-col-header-cell.fc-day-today {
        background: var(--queens-gold) !important;
        border-color: #d49d00 !important;
      }
      .fc .fc-col-header-cell.fc-day-today .fc-col-header-cell-cushion {
        color: var(--queens-gold-text) !important;
        font-weight: 800;
      }
      .fc-list-event td {
        padding: 6px 5px !important;
      }
      .fc-list-event:hover td,
      .fc-list-event:active td {
        background: #b90e31 !important;
        color: #fff !important;
      }
      .fc-list-event:hover a,
      .fc-list-event:active a,
      .fc-list-event:hover .event-location,
      .fc-list-event:active .event-location {
        color: #fff !important;
      }
      .event-title {
        font-weight: 750;
        line-height: 1.2;
      }
      .event-location {
        margin-top: 2px;
        color: #2563eb;
        font-size: 11px;
      }
      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 12px;
      }
      .modal[hidden] {
        display: none;
      }
      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(8, 15, 28, 0.56);
        backdrop-filter: blur(3px);
      }
      .modal-card {
        position: relative;
        width: min(92vw, 520px);
        max-height: min(82dvh, 620px);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        padding: 18px;
      }
      .modal-card h2 {
        margin: 0 0 14px;
        font-size: 23px;
        line-height: 1.15;
      }
      .detail {
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 10px;
        margin: 10px 0;
        align-items: start;
      }
      .detail-icon {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: #e8f2ff;
        color: #076bd3;
      }
      .detail small {
        display: block;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .detail p {
        margin: 2px 0 0;
        line-height: 1.35;
      }
      .description {
        margin: 12px 0;
        padding: 10px;
        border-radius: 10px;
        background: var(--page);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .add-button {
        width: 100%;
        min-height: 50px;
        margin-top: 15px;
        border: 0;
        border-radius: 12px;
        background: #087df0;
        color: #fff;
        font-size: 18px;
        font-weight: 800;
      }
      @media (orientation: portrait) {
        .calendar-shell {
          margin-left: -4px;
          width: calc(100% + 8px);
        }
        .fc .fc-toolbar {
          flex-wrap: nowrap;
        }
        .fc .fc-toolbar-chunk {
          display: flex;
          align-items: center;
        }
        .fc .fc-toolbar-chunk:nth-child(2) {
          min-width: 0;
        }
        .fc .fc-toolbar-title {
          white-space: normal;
        }
      }
      @media (orientation: landscape) and (min-width: 700px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }
        body {
          display: flex;
          flex-direction: column;
        }
        .site-header {
          flex: 0 0 auto;
          padding-top: max(6px, env(safe-area-inset-top));
          padding-bottom: 6px;
        }
        .brand h1 {
          font-size: 26px;
        }
        .brand p {
          font-size: 13px;
        }
        main {
          min-height: 0;
          flex: 1;
          display: flex;
          flex-direction: column;
          padding: 3px 5px 5px;
        }
        .filters {
          grid-template-columns: 1fr 1fr;
          flex: 0 0 auto;
        }
        .filter-field {
          grid-template-columns: 64px minmax(0, 1fr);
        }
        .calendar-shell {
          min-height: 0;
          flex: 1;
          overflow: hidden;
        }
        #calendar,
        .fc {
          height: 100%;
        }
        .fc .fc-toolbar-title {
          font-size: 20px;
        }
        .fc .fc-timegrid-slot {
          height: 1.25em;
        }
        .fc .fc-col-header-cell-cushion {
          padding: 2px 4px;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f1f3f7;
          --muted: #aeb5c2;
          --line: #3b4250;
          --panel: #1e1f22;
          --page: #111214;
          --top: #303135;
          --day-heading-bg: #2a2e35;
          --day-heading-text: #e6eaf0;
          --day-heading-border: #444b57;
        }
        .detail-icon {
          background: #18344e;
          color: #75baff;
        }
        .fc-theme-standard td,
        .fc-theme-standard th,
        .fc-theme-standard .fc-scrollgrid {
          border-color: var(--line) !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <h1>Queen's ARC Schedule</h1>
          <p>Tap an event to add to calendar</p>
        </div>
        <nav class="header-actions" aria-label="Project links">
          <a class="action-link about" href="about.html">About</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="filters" aria-label="Schedule filters">
        <div class="filter-field">
          <label for="activityFilter">Activity</label
          ><select id="activityFilter">
            <option value="all">All</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="locationFilter">Location</label
          ><select id="locationFilter">
            <option value="all">All</option>
          </select>
        </div>
      </section>
      <section class="calendar-shell" aria-label="Two-week activity schedule">
        <div id="calendar"></div>
      </section>
    </main>
    <div
      id="eventModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      hidden
    >
      <div class="modal-backdrop" data-close-modal></div>
      <article class="modal-card">
        <h2 id="modalTitle"></h2>
        <div class="detail">
          <span class="detail-icon">📍</span>
          <div>
            <small>Location</small>
            <p id="locText"></p>
          </div>
        </div>
        <div class="detail">
          <span class="detail-icon">◷</span>
          <div>
            <small>Time</small>
            <p id="modalTime"></p>
          </div>
        </div>
        <div id="modalDesc" class="description" hidden></div>
        <button id="addToCalBtn" class="add-button" type="button">
          Add to Calendar
        </button>
      </article>
    </div>
    <script>
      let calendar,
        selectedEvent = null,
        scrollPosition = 0,
        allEvents = [];
      const portraitQuery = matchMedia("(orientation: portrait)");
      const startOfWeek = (date) => {
        const value = new Date(date),
          day = value.getDay();
        value.setHours(0, 0, 0, 0);
        value.setDate(value.getDate() - day);
        return value;
      };
      const rangeStart = startOfWeek(new Date()),
        rangeEnd = new Date(rangeStart);
      rangeEnd.setDate(rangeEnd.getDate() + 14);
      document.addEventListener("DOMContentLoaded", () => {
        calendar = new FullCalendar.Calendar(
          document.getElementById("calendar"),
          {
            initialView: portraitQuery.matches ? "listWeek" : "timeGridWeek",
            initialDate: new Date(),
            validRange: { start: rangeStart, end: rangeEnd },
            headerToolbar: {
              left: "thisWeek",
              center: "title",
              right: "nextWeek",
            },
            customButtons: {
              thisWeek: {
                text: "This Week",
                click: () => calendar.gotoDate(rangeStart),
              },
              nextWeek: {
                text: "Next Week",
                click: () => {
                  const nextWeekStart = new Date(rangeStart);
                  nextWeekStart.setDate(nextWeekStart.getDate() + 7);
                  calendar.gotoDate(nextWeekStart);
                },
              },
            },
            firstDay: 0,
            slotMinTime: "06:00:00",
            slotMaxTime: "23:00:00",
            height: portraitQuery.matches ? "auto" : "100%",
            expandRows: true,
            nowIndicator: true,
            allDaySlot: false,
            navLinks: false,
            eventContent: renderEvent,
            eventClick: (info) => {
              info.jsEvent.preventDefault();
              showModal(info.event);
            },
            datesSet: updateNavigationState,
          },
        );
        calendar.render();
        activityFilter.addEventListener("change", () => applyFilters(true));
        locationFilter.addEventListener("change", () => applyFilters(true));
        document
          .querySelector("[data-close-modal]")
          .addEventListener("click", closeModal);
        addToCalBtn.addEventListener("click", addToCalendar);
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeModal();
        });
        portraitQuery.addEventListener("change", (event) => {
          calendar.setOption("height", event.matches ? "auto" : "100%");
          calendar.changeView(event.matches ? "listWeek" : "timeGridWeek");
          calendar.updateSize();
        });
        preventGestureZoom();
        fetchAndParseICS();
      });
      function updateNavigationState(info) {
        requestAnimationFrame(() => {
          const thisWeekButton = document.querySelector(
            ".fc-thisWeek-button",
          );
          const nextWeekButton = document.querySelector(
            ".fc-nextWeek-button",
          );
          const isThisWeek = info.start.getTime() === rangeStart.getTime();

          if (thisWeekButton) thisWeekButton.disabled = isThisWeek;
          if (nextWeekButton) nextWeekButton.disabled = !isThisWeek;
        });
      }
      function renderEvent(arg) {
        const wrap = document.createElement("div"),
          title = document.createElement("div");
        title.className = "event-title";
        title.textContent = arg.event.title;
        wrap.appendChild(title);
        const location = arg.event.extendedProps.location;
        if (location) {
          const loc = document.createElement("div");
          loc.className = "event-location";
          loc.textContent = `📍 ${location}`;
          wrap.appendChild(loc);
        }
        return { domNodes: [wrap] };
      }
      async function fetchAndParseICS() {
        try {
          const response = await fetch("./gym.ics");
          if (!response.ok) throw new Error("Schedule file not found");
          parseICS(await response.text());
        } catch (error) {
          console.error("Could not load schedule:", error);
        }
      }
      function parseICS(data) {
        try {
          const component = new ICAL.Component(ICAL.parse(data));
          allEvents = component
            .getAllSubcomponents("vevent")
            .flatMap((raw) => {
              const status = raw.getFirstPropertyValue("status"),
                event = new ICAL.Event(raw);
              if (
                (status && status.toUpperCase() === "CANCELLED") ||
                !event.location?.trim()
              )
                return [];
              const summary = event.summary || "Untitled activity",
                lower = summary.toLowerCase();
              let color = "#ea580c";
              if (lower.includes("basketball")) color = "#f59e0b";
              if (lower.includes("pickleball")) color = "#9333ea";
              if (lower.includes("volleyball")) color = "#0d9488";
              if (lower.includes("futsal") || lower.includes("soccer"))
                color = "#be123c";
              if (lower.includes("spikeball")) color = "#84cc16";
              if (lower.includes("yoga") || lower.includes("pilates"))
                color = "#16a34a";
              if (
                lower.includes("swim") ||
                lower.includes("pool") ||
                lower.includes("aquafit")
              )
                color = "#0284c7";
              if (lower.includes("zumba") || lower.includes("dance"))
                color = "#db2777";
              if (lower.includes("barre")) color = "#7c3aed";
              return [
                {
                  title: summary,
                  start: event.startDate.toString(),
                  end: event.endDate.toString(),
                  color,
                  extendedProps: {
                    location: event.location,
                    icalStart: event.startDate,
                    icalEnd: event.endDate,
                    description: event.description || "",
                  },
                },
              ];
            })
            .filter(
              (item) =>
                new Date(item.start) < rangeEnd &&
                new Date(item.end) >= rangeStart,
            );
          populateDropdowns();
          applyFilters(false);
        } catch (error) {
          console.error("Could not parse schedule:", error);
        }
      }
      function populateDropdowns() {
        activityFilter.innerHTML = '<option value="all">All</option>';
        locationFilter.innerHTML = '<option value="all">All</option>';
        const add = (select, values) =>
          [...values]
            .sort()
            .forEach((value) => select.add(new Option(value, value)));
        add(
          activityFilter,
          new Set(allEvents.map((e) => e.title).filter(Boolean)),
        );
        add(
          locationFilter,
          new Set(
            allEvents.map((e) => e.extendedProps.location).filter(Boolean),
          ),
        );
        const a = localStorage.getItem("gym_activity"),
          l = localStorage.getItem("gym_location");
        if ([...activityFilter.options].some((o) => o.value === a))
          activityFilter.value = a;
        if ([...locationFilter.options].some((o) => o.value === l))
          locationFilter.value = l;
      }
      function applyFilters(save) {
        const a = activityFilter.value,
          l = locationFilter.value;
        if (save) {
          localStorage.setItem("gym_activity", a);
          localStorage.setItem("gym_location", l);
        }
        calendar.removeAllEvents();
        calendar.addEventSource(
          allEvents.filter(
            (e) =>
              (a === "all" || e.title === a) &&
              (l === "all" || e.extendedProps.location === l),
          ),
        );
      }
      function cleanDescription(value) {
        const doc = new DOMParser().parseFromString(
          String(value || "").replace(/<br\s*\/?>/gi, "\n"),
          "text/html",
        );
        return doc.body.textContent || "";
      }
      function escapeICS(value) {
        return String(value || "")
          .replace(/\\/g, "\\\\")
          .replace(/;/g, "\\;")
          .replace(/,/g, "\\,")
          .replace(/\n/g, "\\n");
      }
      const pad = (value) => String(value).padStart(2, "0"),
        formatIcal = (time) =>
          `${time.year}${pad(time.month)}${pad(time.day)}T${pad(time.hour)}${pad(time.minute)}${pad(time.second)}`;
      function makeCalendarFile(event) {
        const now = new Date()
          .toISOString()
          .replace(/[-:]/g, "")
          .replace(/\.\d+/, "");
        const content = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Queen's ARC Schedule//EN\r\nCALSCALE:GREGORIAN\r\nBEGIN:VEVENT\r\nUID:${now}-${Math.random().toString(36).slice(2)}@queens-arc-schedule\r\nDTSTAMP:${now}\r\nDTSTART;TZID=America/Toronto:${formatIcal(event.extendedProps.icalStart)}\r\nDTEND;TZID=America/Toronto:${formatIcal(event.extendedProps.icalEnd)}\r\nSUMMARY:${escapeICS(event.title)}\r\nDESCRIPTION:${escapeICS(cleanDescription(event.extendedProps.description))}\r\nLOCATION:${escapeICS(event.extendedProps.location)}\r\nEND:VEVENT\r\nEND:VCALENDAR`;
        return new File(
          [content],
          `${event.title.replace(/[^a-z0-9_-]+/gi, "_") || "ARC_event"}.ics`,
          { type: "text/calendar;charset=utf-8" },
        );
      }
      function addToCalendar() {
        if (!selectedEvent) return;
        const file = makeCalendarFile(selectedEvent);
        const url = URL.createObjectURL(file);
        const link = document.createElement("a");
        link.href = url;
        link.download = file.name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }
      function showModal(event) {
        selectedEvent = event;
        modalTitle.textContent = event.title;
        locText.textContent =
          event.extendedProps.location || "No location information";
        const date = event.start.toLocaleDateString([], {
            weekday: "short",
            month: "short",
            day: "numeric",
          }),
          time = `${event.start.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} – ${event.end.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
        modalTime.textContent = `${date} • ${time}`;
        const text = cleanDescription(event.extendedProps.description);
        modalDesc.textContent = text;
        modalDesc.hidden = !text;
        scrollPosition = scrollY;
        document.body.style.position = "fixed";
        document.body.style.top = `-${scrollPosition}px`;
        document.body.style.width = "100%";
        eventModal.hidden = false;
      }
      function closeModal() {
        if (eventModal.hidden) return;
        eventModal.hidden = true;
        selectedEvent = null;
        document.body.style.position = "";
        document.body.style.top = "";
        document.body.style.width = "";
        scrollTo(0, scrollPosition);
      }
      function preventGestureZoom() {
        ["gesturestart", "gesturechange", "gestureend"].forEach((type) =>
          document.addEventListener(type, (event) => event.preventDefault(), {
            passive: false,
          }),
        );
        let last = 0;
        document.addEventListener(
          "touchend",
          (event) => {
            const now = Date.now();
            if (now - last <= 300) event.preventDefault();
            last = now;
          },
          { passive: false },
        );
      }
    </script>
  </body>
</html>
