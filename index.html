<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="./web_logo.jpg" />
    <link rel="apple-touch-icon" href="./web_logo.jpg" />
    <title>Queen's ARC Schedule</title>
    <script src="./assets/index.global.min.js"></script>
    <script src="./assets/ical.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SM0J28NYS4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SM0J28NYS4');
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./assets/sw.js")
            .then((registration) => {
              console.log("Service Worker registered:", registration.scope);
            })
            .catch((error) => {
              console.error("Service Worker registration failed:", error);
            });
        });
      }
    </script>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <h1>
            <a class="brand-home" href="./" aria-label="Reload Queen's ARC Schedule">
              Queen's ARC Schedule
            </a>
          </h1>
          <p>Tap an event to add to calendar</p>
        </div>
        <nav class="header-actions" aria-label="Project links">
          <a class="action-link about" href="about.html">About</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="filters" aria-label="Schedule filters">
        <div class="filter-field">
          <label for="activityFilter">Activity</label
          ><select id="activityFilter">
            <option value="all">All</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="locationFilter">Location</label
          ><select id="locationFilter">
            <option value="all">All</option>
          </select>
        </div>
      </section>
      <section class="calendar-shell" aria-label="Two-week activity schedule">
        <div
          id="scheduleStatus"
          class="schedule-status"
          role="status"
          aria-live="polite"
        >
          <span class="schedule-spinner" aria-hidden="true"></span>
          <span id="scheduleStatusText">Loading latest schedule…</span>
        </div>
        <div id="calendar"></div>
      </section>
    </main>
    <div
      id="eventModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      hidden
    >
      <div class="modal-backdrop" data-close-modal></div>
      <article class="modal-card">
        <h2 id="modalTitle"></h2>
        <div class="detail">
          <span class="detail-icon">📍</span>
          <div>
            <small>Location</small>
            <p id="locText"></p>
          </div>
        </div>
        <div class="detail">
          <span class="detail-icon">🕒</span>
          <div>
            <small>Time</small>
            <p id="modalTime"></p>
          </div>
        </div>
        <div id="modalDesc" class="description" hidden></div>
        <button id="addToCalBtn" class="add-button" type="button">
          Add to Calendar
        </button>
      </article>
    </div>
    <script src="./assets/app.js" defer></script>
    <div
      id="scheduleToast"
      class="schedule-toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>
  </body>
</html>
