services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: queens-arc-schedule:local
    container_name: queens-arc-schedule
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

