<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />
    <title>About — Queen's ARC Schedule</title>
    <script src="./assets/marked.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SM0J28NYS4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SM0J28NYS4');
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f3f4f6;
        --text: #1b2434;
        --muted: #667085;
        --blue: #0a84ff;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
    html,
    body {
      margin: 0;
      min-height: 100%;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--text);
    }
    main {
      width: min(100%, 900px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      padding: max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right)) 20px
        max(8px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
    }
    .about-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .nav-button {
      width: 88px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      min-height: 38px;
      padding: 7px 12px;
      border: 2px solid transparent;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 750;
      transition:
        transform 0.12s,
        filter 0.12s;
    }
    .back {
      background: var(--blue);
      border-color: var(--blue);
    }
    .star {
      background: #24292e;
      border-color: #24292e;
    }
    .star svg {
      width: 17px;
      height: 17px;
    }
    .nav-button:hover {
      filter: brightness(0.92);
    }
    .nav-button:active {
      transform: scale(0.96);
      filter: brightness(0.8);
    }
    article {
      padding: 0 2px;
    }
    h1 {
      font-size: clamp(27px, 7vw, 38px);
      margin: 8px 0 14px;
    }
    h2 {
      margin-top: 24px;
    }
    p,
    li {
      line-height: 1.55;
    }
    a {
      color: var(--blue);
    }
    footer {
      width: 100%;
      margin-top: auto;
      padding-top: 22px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111214;
        --text: #f1f3f7;
        --muted: #aeb5c2;
      }
    }
    </style>
  </head>
  <body>
    <main>
      <nav class="about-nav" aria-label="About page navigation">
        <a class="nav-button back" href="index.html">‹ Back</a>
        <a
          class="nav-button star"
          href="https://github.com/WinchellWang/Queens-ARC-Schedule"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 17.522 12z"
              clip-rule="evenodd"
            />
          </svg>
          Star
        </a>
      </nav>
      <article>
        <h1>About This Project</h1>
        <div id="readme-content"><p>Loading content…</p></div>
      </article>
      <footer>Copyright © Winchell Wang <span id="year"></span></footer>
    </main>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      const content = document.getElementById("readme-content");
      fetch("./README.md")
        .then((response) => {
          if (!response.ok) throw new Error("README.md not found");
          return response.text();
        })
        .then((text) => (content.innerHTML = marked.parse(text)))
        .catch(
          (error) =>
            (content.textContent = `Error loading content: ${error.message}`),
        );
      ["gesturestart", "gesturechange", "gestureend"].forEach((type) =>
        document.addEventListener(type, (event) => event.preventDefault(), {
          passive: false,
        }),
      );
    </script>
  </body>
</html>
