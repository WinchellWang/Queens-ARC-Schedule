<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />
    <title>About — Queen's ARC Schedule</title>
    <script src="./assets/analytics.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f3f4f6;
        --text: #1b2434;
        --muted: #667085;
        --blue: #0a84ff;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
    html,
    body {
      margin: 0;
      min-height: 100%;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--text);
    }
    main {
      width: min(100%, 900px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      padding: max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right)) 20px
        max(8px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
    }
    .back {
      width: 88px;
      align-self: flex-start;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      min-height: 38px;
      padding: 7px 12px;
      margin-bottom: 8px;
      border: 2px solid var(--blue);
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      font-weight: 750;
      transition:
        transform 0.12s,
        filter 0.12s;
    }
    .back:hover {
      filter: brightness(0.92);
    }
    .back:active {
      transform: scale(0.96);
      filter: brightness(0.8);
    }
    article {
      padding: 0 2px;
    }
    h1 {
      font-size: clamp(27px, 7vw, 38px);
      margin: 8px 0 14px;
    }
    h2 {
      margin-top: 24px;
    }
    p,
    li {
      line-height: 1.55;
    }
    a {
      color: var(--blue);
    }
    footer {
      width: 100%;
      margin-top: auto;
      padding-top: 22px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111214;
        --text: #f1f3f7;
        --muted: #aeb5c2;
      }
    }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="index.html">‹ Back</a>
      <article>
        <h1>About This Project</h1>
        <div id="readme-content"><p>Loading content…</p></div>
      </article>
      <footer>Copyright © Winchell Wang <span id="year"></span></footer>
    </main>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      const content = document.getElementById("readme-content");
      fetch("./README.md")
        .then((response) => {
          if (!response.ok) throw new Error("README.md not found");
          return response.text();
        })
        .then((text) => (content.innerHTML = marked.parse(text)))
        .catch(
          (error) =>
            (content.textContent = `Error loading content: ${error.message}`),
        );
      ["gesturestart", "gesturechange", "gestureend"].forEach((type) =>
        document.addEventListener(type, (event) => event.preventDefault(), {
          passive: false,
        }),
      );
    </script>
  </body>
</html>
