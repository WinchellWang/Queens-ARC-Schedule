<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Queen's ARC Schedule</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Queen's ARC">
    <link rel="manifest" href="manifest.json">
    <script src="./assets/analytics.js"></script>
    <link rel="stylesheet" href="./assets/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-darkbg dark:text-darktext flex flex-col min-h-screen">

    <div class="flex-grow max-w-4xl mx-auto w-full p-4 md:p-8">
        
        <a href="index.html" class="inline-flex items-center text-blue-600 dark:text-blue-400 hover:underline mb-6 font-semibold">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Schedule
        </a>

        <div class="bg-white dark:bg-darkcard rounded-xl shadow-lg p-6 md:p-10 border border-gray-100 dark:border-gray-800">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-6">About This Project</h1>
            
            <div id="readme-content" class="prose dark:prose-invert max-w-none text-gray-700 dark:text-gray-300 leading-relaxed">
                <p class="animate-pulse">Loading content...</p>
            </div>
        </div>

        <p class="mt-8 text-center text-gray-500 dark:text-gray-400 text-sm">
            Copyright © Winchell Wang <span id="year"></span>
        </p>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        fetch('./README.md')
            .then(response => {
                if (!response.ok) throw new Error("README.md not found");
                return response.text();
            })
            .then(text => {
                document.getElementById('readme-content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('readme-content').innerHTML = 
                    `<p class="text-red-500">Error loading content: ${err.message}. Please ensure README.md is in the same folder.</p>`;
            });
    </script>
</body>
</html>
